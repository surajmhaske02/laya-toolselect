name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # laya source only (no torch) for the judge contract test
          pip install --no-deps "laya==0.4.17"
      - name: Test
        run: pytest -q
      - name: Build and check package
        run: |
          python -m build
          pip install twine
          twine check dist/*
